<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 470" font-family="Segoe UI, Arial, sans-serif">
  <rect width="960" height="470" fill="#ffffff"/>
  <text x="480" y="30" font-size="20" font-weight="700" text-anchor="middle" fill="#1a2f73">Path ② — Arduino UNO + MCP2515 (SLCAN) wiring</text>

  <!-- Arduino -->
  <rect x="60" y="70" width="230" height="320" rx="8" fill="#eef7f8" stroke="#00878f" stroke-width="2"/>
  <text x="175" y="95" font-size="15" font-weight="700" text-anchor="middle" fill="#00878f">Arduino UNO (5 V)</text>
  <g font-size="12" text-anchor="start">
    <text x="80" y="135">5V</text>
    <text x="80" y="165">GND</text>
    <text x="80" y="195">D13 (SCK)</text>
    <text x="80" y="225">D12 (MISO)</text>
    <text x="80" y="255">D11 (MOSI)</text>
    <text x="80" y="285">D10 (CS)*</text>
    <text x="80" y="315">D2  (INT)*</text>
  </g>
  <text x="175" y="358" font-size="10" text-anchor="middle" fill="#555">* CS/INT pins must match</text>
  <text x="175" y="372" font-size="10" text-anchor="middle" fill="#555">the firmware (Seeed lib)</text>

  <!-- MCP2515 module -->
  <rect x="420" y="70" width="230" height="320" rx="8" fill="#f3f6ee" stroke="#2e7d32" stroke-width="2"/>
  <text x="535" y="95" font-size="15" font-weight="700" text-anchor="middle" fill="#2e7d32">MCP2515 module</text>
  <text x="535" y="113" font-size="11" text-anchor="middle" fill="#555">MCP2515 + TJA1050, 8 MHz</text>
  <g font-size="12" text-anchor="end">
    <text x="630" y="135">VCC</text>
    <text x="630" y="165">GND</text>
    <text x="630" y="195">SCK</text>
    <text x="630" y="225">SO (MISO)</text>
    <text x="630" y="255">SI (MOSI)</text>
    <text x="630" y="285">CS</text>
    <text x="630" y="315">INT</text>
  </g>
  <g font-size="12" text-anchor="start" fill="#b00020">
    <text x="440" y="345">CAN-H</text>
    <text x="440" y="368">CAN-L</text>
  </g>

  <!-- wires Arduino <-> MCP2515 -->
  <g stroke-width="2" fill="none">
    <line x1="150" y1="131" x2="628" y2="131" stroke="#b38f00"/>
    <line x1="150" y1="161" x2="628" y2="161" stroke="#333"/>
    <line x1="170" y1="191" x2="628" y2="191" stroke="#0a7"/>
    <line x1="170" y1="221" x2="628" y2="221" stroke="#0a7"/>
    <line x1="170" y1="251" x2="628" y2="251" stroke="#0a7"/>
    <line x1="170" y1="281" x2="628" y2="281" stroke="#a4005a"/>
    <line x1="170" y1="311" x2="628" y2="311" stroke="#1a2f73"/>
  </g>

  <!-- OBD side -->
  <rect x="740" y="250" width="170" height="140" rx="8" fill="#eef1f8" stroke="#1a2f73" stroke-width="2"/>
  <text x="825" y="275" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2f73">Vehicle OBD-II</text>
  <text x="825" y="300" font-size="11" text-anchor="middle" fill="#b00020">pin 6  → CAN-H</text>
  <text x="825" y="320" font-size="11" text-anchor="middle" fill="#b00020">pin 14 → CAN-L</text>
  <text x="825" y="344" font-size="10" text-anchor="middle" fill="#555">(do NOT wire pin 16</text>
  <text x="825" y="358" font-size="10" text-anchor="middle" fill="#555">+12 V to the module)</text>
  <line x1="470" y1="340" x2="740" y2="300" stroke="#b00020" stroke-width="2"/>
  <line x1="470" y1="363" x2="740" y2="320" stroke="#b00020" stroke-width="2"/>

  <!-- USB to TES -->
  <rect x="740" y="80" width="170" height="120" rx="8" fill="#eef1f8" stroke="#1a2f73" stroke-width="2"/>
  <text x="825" y="105" font-size="13" font-weight="700" text-anchor="middle" fill="#1a2f73">TES laptop</text>
  <text x="825" y="130" font-size="11" text-anchor="middle">Serial-CAN (slcan)</text>
  <text x="825" y="150" font-size="11" text-anchor="middle">transport</text>
  <text x="825" y="174" font-size="10" text-anchor="middle" fill="#555">pick the COM port, set</text>
  <text x="825" y="188" font-size="10" text-anchor="middle" fill="#555">the bus speed, Connect</text>
  <path d="M175 70 C 175 50, 825 50, 825 80" stroke="#333" stroke-width="2" fill="none"/>
  <text x="500" y="44" font-size="11" text-anchor="middle" fill="#555">USB cable (serial @ 115200)</text>

  <text x="480" y="420" font-size="11" text-anchor="middle" fill="#b00020" font-weight="600">Arduino is 5 V — fine for a 5 V MCP2515 module. Do NOT feed OBD +12 V (pin 16) anywhere near it.</text>
  <text x="480" y="440" font-size="11" text-anchor="middle" fill="#555">On the bench (single node) enable the module's 120 Ω terminator; on a vehicle leave it OFF.</text>
  <text x="480" y="458" font-size="10" text-anchor="middle" fill="#555">Common gotcha: module crystal is usually 8 MHz — set CAN_8MHZ in the firmware, not 16 MHz.</text>
</svg>
